// ── Calendar (Today View) ──
const CAL_START_HOUR = 8;
const CAL_END_HOUR = 20; // 8pm
const CAL_SLOT_MIN = 15;
function getTimeBlocksKey() { return getDomainConfig().timeBlocksKey; }
let calendarEvents = [];

function getViewDate() {
  return todayViewDate || new Date().toLocaleDateString('en-CA', { timeZone: 'America/Denver' });
}

function getTimeBlocks() {
  try {
    const stored = JSON.parse(localStorage.getItem(getTimeBlocksKey()));
    if (!stored) return [];
    return (stored[getViewDate()] || []);
  } catch(e) { return []; }
}

function saveTimeBlocks(blocks) {
  try {
    const dateStr = getViewDate();
    const stored = JSON.parse(localStorage.getItem(getTimeBlocksKey()) || '{}');
    stored[dateStr] = blocks;
    // Clean up old days (keep last 14)
    const keys = Object.keys(stored).sort();
    while (keys.length > 14) { delete stored[keys.shift()]; }
    localStorage.setItem(getTimeBlocksKey(), JSON.stringify(stored));
  } catch(e) {}
}

function addTimeBlock(slotTime, title, color, sourceType, sourceId, duration) {
  const blocks = getTimeBlocks();
  // Remove existing block for this source to avoid duplicates
  const filtered = blocks.filter(b => !(b.sourceType === sourceType && b.sourceId === sourceId));
  filtered.push({ slotTime, title, color, sourceType, sourceId, duration: duration || 30 });
  saveTimeBlocks(filtered);
  renderCalendarSlots();
}

function removeTimeBlock(sourceType, sourceId) {
  const blocks = getTimeBlocks().filter(b => !(b.sourceType === sourceType && b.sourceId === sourceId));
  saveTimeBlocks(blocks);
  renderCalendarSlots();
}

function renderCalendarSlots() {
  const body = document.getElementById('today-calendar-body');
  if (!body) return;

  const blocks = getTimeBlocks();
  let html = '';

  for (let h = CAL_START_HOUR; h < CAL_END_HOUR; h++) {
    for (let m = 0; m < 60; m += CAL_SLOT_MIN) {
      const timeStr = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
      const isHour = m === 0;
      const displayTime = isHour ? formatHour(h) : '';
      html += `
        <div class="cal-slot ${isHour ? '' : 'half-hour'}" data-time="${timeStr}">
          <div class="cal-slot-time">${displayTime}</div>
          <div class="cal-slot-area" data-slot-time="${timeStr}"></div>
        </div>
      `;
    }
  }

  body.innerHTML = html;

  // Render calendar events (from iCal)
  calendarEvents.forEach(evt => {
    if (evt.allDay) return;
    const startMin = timeToMinutes(evt.start.slice(11, 16));
    const endMin = evt.end ? timeToMinutes(evt.end.slice(11, 16)) : startMin + 30;
    placeCalendarBlock(body, startMin, endMin, evt.summary, 'cal-event', null, evt.start.slice(11,16));
  });

  // Render time blocks (user-scheduled tasks)
  blocks.forEach(block => {
    const startMin = timeToMinutes(block.slotTime);
    const endMin = startMin + (block.duration || 30);
    placeCalendarBlock(body, startMin, endMin, block.title, 'cal-block', block, null);
  });

  // Now-line (only show when viewing actual today)
  const now = new Date();
  const actualTodayStr = now.toLocaleDateString('en-CA', { timeZone: 'America/Denver' });
  const isViewingToday = !todayViewDate || todayViewDate === actualTodayStr;
  const nowH = parseInt(now.toLocaleString('en-US', { timeZone: 'America/Denver', hour: 'numeric', hour12: false }));
  const nowM = parseInt(now.toLocaleString('en-US', { timeZone: 'America/Denver', minute: 'numeric' }));
  const nowMin = nowH * 60 + nowM;
  const calStartMin = CAL_START_HOUR * 60;
  const calEndMin = CAL_END_HOUR * 60;
  if (isViewingToday && nowMin >= calStartMin && nowMin < calEndMin) {
    const slotH = 32; // slot height in px
    const totalSlots = (CAL_END_HOUR - CAL_START_HOUR) * (60 / CAL_SLOT_MIN);
    const pxPerMin = (totalSlots * slotH) / (calEndMin - calStartMin);
    const topPx = (nowMin - calStartMin) * pxPerMin;
    const nowLine = document.createElement('div');
    nowLine.className = 'cal-now-line';
    nowLine.id = 'cal-now-line';
    nowLine.style.top = topPx + 'px';
    body.appendChild(nowLine);

    // Scroll now-line into view
    body.scrollTop = Math.max(0, topPx - 100);
  }

  // Start the now-line ticker (clears any previous one)
  startNowLineTicker();

  // Set up drop targets
  setupCalendarDropTargets(body);
}

let _nowLineTicker = null;
function startNowLineTicker() {
  if (_nowLineTicker) clearInterval(_nowLineTicker);
  _nowLineTicker = setInterval(updateNowLine, 60000);
}
function updateNowLine() {
  const line = document.getElementById('cal-now-line');
  const body = document.getElementById('today-calendar-body');
  if (!body) return;
  const now = new Date();
  const actualTodayStr = now.toLocaleDateString('en-CA', { timeZone: 'America/Denver' });
  const isViewingToday = !todayViewDate || todayViewDate === actualTodayStr;
  const nowH = parseInt(now.toLocaleString('en-US', { timeZone: 'America/Denver', hour: 'numeric', hour12: false }));
  const nowM = parseInt(now.toLocaleString('en-US', { timeZone: 'America/Denver', minute: 'numeric' }));
  const nowMin = nowH * 60 + nowM;
  const calStartMin = CAL_START_HOUR * 60;
  const calEndMin = CAL_END_HOUR * 60;
  if (isViewingToday && nowMin >= calStartMin && nowMin < calEndMin) {
    const slotH = 32;
    const totalSlots = (CAL_END_HOUR - CAL_START_HOUR) * (60 / CAL_SLOT_MIN);
    const pxPerMin = (totalSlots * slotH) / (calEndMin - calStartMin);
    const topPx = (nowMin - calStartMin) * pxPerMin;
    if (line) {
      line.style.top = topPx + 'px';
    } else {
      const nl = document.createElement('div');
      nl.className = 'cal-now-line';
      nl.id = 'cal-now-line';
      nl.style.top = topPx + 'px';
      body.appendChild(nl);
    }
  } else if (line) {
    line.remove();
  }
}

function placeCalendarBlock(body, startMin, endMin, title, className, block, timeLabel) {
  const calStartMin = CAL_START_HOUR * 60;
  const calEndMin = CAL_END_HOUR * 60;
  if (startMin >= calEndMin || endMin <= calStartMin) return;

  const clampStart = Math.max(startMin, calStartMin);
  const clampEnd = Math.min(endMin, calEndMin);
  const slotH = 32;
  const pxPerMin = slotH / CAL_SLOT_MIN;
  const topPx = (clampStart - calStartMin) * pxPerMin;
  const heightPx = Math.max((clampEnd - clampStart) * pxPerMin - 2, 18);

  const el = document.createElement('div');
  el.className = className;
  if (block && block.sourceType === 'card') el.classList.add('cal-block-rock');
  el.style.top = topPx + 'px';
  el.style.height = heightPx + 'px';
  el.style.position = 'absolute';
  el.style.left = '52px';
  el.style.right = '4px';

  if (block && block.color) {
    el.style.setProperty('--card-tint', block.color);
    el.style.borderLeftColor = block.color;
    el.style.background = `color-mix(in srgb, ${block.color} 10%, var(--surface))`;
  }

  let inner = `<span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(title)}</span>`;
  if (timeLabel) {
    const endT = minutesToTime(endMin);
    inner += `<div class="cal-event-time">${formatTime12(timeLabel)} – ${formatTime12(endT)}</div>`;
  }
  if (block) {
    inner += `<button class="cal-block-remove" onclick="removeTimeBlock('${block.sourceType}','${block.sourceId}')" title="Remove">×</button>`;
  }
  el.innerHTML = inner;

  // Make blocks draggable to reschedule
  if (block) {
    el.draggable = true;
    el.dataset.dragType = block.sourceType;
    el.dataset.dragTitle = block.title;
    el.dataset.dragColor = block.color || '';
    el.dataset.dragId = block.sourceId;
    el.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', JSON.stringify({
        type: block.sourceType, id: block.sourceId, title: block.title, color: block.color
      }));
      e.dataTransfer.effectAllowed = 'move';
    });
  }

  body.appendChild(el);
}

function setupCalendarDropTargets(body) {
  const slots = body.querySelectorAll('.cal-slot-area');
  slots.forEach(slot => {
    slot.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      slot.classList.add('drag-over');
    });
    slot.addEventListener('dragleave', function() {
      slot.classList.remove('drag-over');
    });
    slot.addEventListener('drop', function(e) {
      e.preventDefault();
      slot.classList.remove('drag-over');
      try {
        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
        const slotTime = slot.dataset.slotTime;
        showDurationPicker(slotTime, data);
      } catch(err) {}
    });
  });
}

let _pendingDrop = null;

function showDurationPicker(slotTime, data) {
  _pendingDrop = { slotTime, data };
  const picker = document.getElementById('duration-picker');
  const overlay = document.getElementById('duration-picker-overlay');
  const timeDisplay = formatTime12(slotTime);
  const durations = [
    { label: '15m', mins: 15 },
    { label: '30m', mins: 30 },
    { label: '45m', mins: 45 },
    { label: '1 hr', mins: 60 },
    { label: '90m', mins: 90 },
  ];

  picker.innerHTML = `
    <h4>${esc(data.title)}</h4>
    <p class="duration-picker-subtitle">Drop at ${timeDisplay} — how long?</p>
    <div class="duration-picker-options">
      ${durations.map(d => `
        <button class="duration-picker-btn" onclick="selectDuration(${d.mins})">${d.label}</button>
      `).join('')}
    </div>
    <button class="duration-picker-cancel" onclick="closeDurationPicker()">Cancel</button>
  `;

  overlay.classList.add('open');
}

function selectDuration(minutes) {
  const { slotTime, data } = _pendingDrop;
  _pendingDrop = null;
  closeDurationPicker();
  addTimeBlock(slotTime, data.title, data.color, data.type, data.id, minutes);
}

function closeDurationPicker() {
  document.getElementById('duration-picker-overlay').classList.remove('open');
  _pendingDrop = null;
}

// ── Weekly Routines (chores) ──
function getRoutinesKey() { return 'dashboard-routines-' + activeDomain; }
function getRoutineChecksKey() { return 'dashboard-routine-checks-' + activeDomain; }

function getRoutines() {
  try { return JSON.parse(localStorage.getItem(getRoutinesKey())) || []; } catch(e) { return []; }
}
function saveRoutines(routines) {
  try { localStorage.setItem(getRoutinesKey(), JSON.stringify(routines)); } catch(e) {}
}

function getCurrentWeekMonday() {
  const now = new Date();
  const d = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (d === 0 ? 6 : d - 1));
  return mon.toLocaleDateString('en-CA');
}

function getRoutineChecks() {
  try {
    const stored = JSON.parse(localStorage.getItem(getRoutineChecksKey())) || {};
    const weekKey = getCurrentWeekMonday();
    // Auto-reset: only return checks for current week
    if (stored._week !== weekKey) return {};
    return stored;
  } catch(e) { return {}; }
}

function saveRoutineChecks(checks) {
  try {
    checks._week = getCurrentWeekMonday();
    localStorage.setItem(getRoutineChecksKey(), JSON.stringify(checks));
  } catch(e) {}
}

function toggleRoutineCheck(routineId, dayId) {
  const checks = getRoutineChecks();
  const key = routineId + ':' + dayId;
  if (checks[key]) delete checks[key];
  else checks[key] = true;
  saveRoutineChecks(checks);
  renderWeek();
}

function addRoutine(dayLabel) {
  const name = prompt('Routine name:');
  if (!name || !name.trim()) return;
  const routines = getRoutines();
  routines.push({ id: Date.now().toString(36), name: name.trim(), day: dayLabel });
  saveRoutines(routines);
  renderWeek();
}

function getRoutinesForDay(shortDayLabel) {
  const routines = getRoutines();
  const weekKey = getCurrentWeekMonday();
  return routines.filter(r => {
    const effectiveDay = (r.overrideWeek === weekKey && r.overrideDay) ? r.overrideDay : r.day;
    return effectiveDay === shortDayLabel;
  }).map(r => ({
    ...r,
    defaultDay: r.day,
    day: (r.overrideWeek === getCurrentWeekMonday() && r.overrideDay) ? r.overrideDay : r.day,
  }));
}

function moveRoutineToDay(routineId, newDay) {
  const routines = getRoutines();
  const r = routines.find(x => x.id === routineId);
  if (!r) return;
  r.overrideWeek = getCurrentWeekMonday();
  r.overrideDay = newDay;
  saveRoutines(routines);
  renderWeek();
}

function removeRoutine(routineId) {
  const routines = getRoutines().filter(r => r.id !== routineId);
  saveRoutines(routines);
  // Also clean up checks
  const checks = getRoutineChecks();
  Object.keys(checks).forEach(k => { if (k.startsWith(routineId + ':')) delete checks[k]; });
  saveRoutineChecks(checks);
  renderWeek();
}

function setupTodoistToRocksDrop(view) {
  const zone = view.querySelector('.rocks-drop-zone');
  if (!zone) return;
  // Use the day column if available, fall back to Big Rocks column
  const targetCol = zone.dataset.rocksDropColumn || THIS_WEEK_ROCKS.id;
  if (!targetCol) return;

  zone.addEventListener('dragover', function(e) {
    // Only highlight for Todoist task drags, not card reorder drags
    if (!e.dataTransfer.types.includes('application/todoist-task')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    zone.classList.add('drag-over');
  });
  zone.addEventListener('dragleave', function(e) {
    if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
  });
  zone.addEventListener('drop', function(e) {
    zone.classList.remove('drag-over');
    if (!e.dataTransfer.types.includes('application/todoist-task')) return;
    e.preventDefault();
    try {
      const data = JSON.parse(e.dataTransfer.getData('text/plain'));
      if (data.type !== 'todoist') return;
      // Create a new Big Rock card from the Todoist task
      const defaultProject = state.projects[0];
      state.cards.push({
        id: generateId(),
        title: data.title,
        note: '',
        projectId: defaultProject ? defaultProject.id : '',
        column: targetCol,
        details: [],
        expanded: false,
        order: state.cards.filter(c => c.column === targetCol).length,
      });
      saveState();
      showToday(todayViewDate);
    } catch(err) {}
  });
}

async function fetchCalendarEvents() {
  const body = document.getElementById('today-calendar-body');
  try {
    const dateParam = todayViewDate ? `?date=${todayViewDate}` : '';
    const resp = await fetch('/api/calendar' + dateParam);
    if (!resp.ok) {
      // Calendar not configured — render slots without events
      calendarEvents = [];
      renderCalendarSlots();
      return;
    }
    const data = await resp.json();
    calendarEvents = data.events || [];
    renderCalendarSlots();
  } catch(e) {
    calendarEvents = [];
    renderCalendarSlots();
  }
}

function timeToMinutes(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + (m || 0);
}

function minutesToTime(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

function formatHour(h) {
  if (h === 0 || h === 12) return (h === 0 ? '12' : '12') + (h < 12 ? 'a' : 'p');
  return (h > 12 ? h - 12 : h) + (h >= 12 ? 'p' : 'a');
}

function formatTime12(t) {
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return h12 + ':' + String(m).padStart(2, '0') + ampm;
}

      [...activeItems, ...doneItems].forEach(item => {

    html += `</div>`;
  });

  view.innerHTML = html;

  // Make punch lists draggable for reordering
  view.querySelectorAll('.punch-list').forEach(list => {
    new Sortable(list, {
      animation: 200,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      handle: '.punch-item-body',
      draggable: '.punch-item',
      onEnd: function(evt) {
        const listEl = evt.to;
        const orderedIds = Array.from(listEl.querySelectorAll('.punch-item')).map(el => el.dataset.punchId);
        // Rebuild the items array with this section's items in the new order
        const sectionItems = orderedIds.map(id => punchState.items.find(i => i.id === id)).filter(Boolean);
        const otherItems = punchState.items.filter(i => !orderedIds.includes(i.id));
        punchState.items = [...otherItems, ...sectionItems];
        savePunch();
      },
    });
  });
}

function addPunchItem(sectionId) {
  const input = document.getElementById('punch-input-' + sectionId);
  if (!input) return;
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  punchState.items.push({
    id: generateId(),
    text: text,
    done: false,
    section: sectionId,
    created: Date.now(),
  });
  savePunch();
  input.value = '';
  renderPunch();
  const newInput = document.getElementById('punch-input-' + sectionId);
  if (newInput) newInput.focus();
}

function togglePunch(id) {
  const item = punchState.items.find(i => i.id === id);
  if (!item) return;
  item.done = !item.done;
  savePunch();
  renderPunch();
}

function deletePunch(id) {
  punchState.items = punchState.items.filter(i => i.id !== id);
  savePunch();
  renderPunch();
}

function duplicatePunch(id) {
  const item = punchState.items.find(i => i.id === id);
  if (!item) return;
  const dup = { id: generateId(), text: item.text, note: item.note || '', done: false, section: item.section, created: Date.now() };
  const idx = punchState.items.indexOf(item);
  punchState.items.splice(idx + 1, 0, dup);
  savePunch();
  renderPunch();
}

// ── Todoist Integration (REST API) ──
let todoistTasks = null;
let todoistError = null;
let todoistLoading = true;
let todoistInterval = null;
function getTodoistOrderKey() { return getDomainConfig().todoistOrderKey; }

function getTodoistOrder() {
  try { return JSON.parse(localStorage.getItem(getTodoistOrderKey())) || []; } catch(e) { return []; }
}
function saveTodoistOrder(orderedIds) {
  try { localStorage.setItem(getTodoistOrderKey(), JSON.stringify(orderedIds)); } catch(e) {}
}

async function fetchTodoistTasks() {
  todoistLoading = true;
  todoistError = null;
  renderTodoistSection();

  try {
    const projects = combinedToday ? ['PERSONAL', 'HOME'] : [getTodoistProject()];
    const allTasks = [];
    for (const proj of projects) {
      const params = new URLSearchParams();
      if (todayViewDate) params.set('date', todayViewDate);
      params.set('project', proj);
      const resp = await fetch('/api/todoist?' + params.toString());
      if (!resp.ok) {
        const data = await resp.json().catch(() => ({}));
        if (resp.status === 500 && data.error && data.error.includes('not configured')) {
          todoistError = 'not_configured';
        } else {
          todoistError = 'unavailable';
        }
        todoistLoading = false;
        renderTodoistSection();
        return;
      }
      const data = await resp.json();
      allTasks.push(...(data.tasks || []));
    }
    todoistTasks = allTasks;
    todoistError = null;
  } catch (e) {
    todoistError = 'unavailable';
    todoistTasks = null;
  }
  todoistLoading = false;
  renderTodoistSection();
}

async function completeTodoistTask(taskId) {
  const el = document.querySelector(`.todoist-task[data-task-id="${taskId}"]`);
  if (el) el.classList.add('completing');
  try {
    const resp = await fetch('/api/todoist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ taskId }),
    });
    if (resp.ok) {
      if (el) {
        el.classList.remove('completing');
        el.classList.add('completed');
      }
    } else {
      if (el) el.classList.remove('completing');
    }
  } catch (e) {
    if (el) el.classList.remove('completing');
  }
}

function renderTodoistSection() {
  const container = document.getElementById('todoist-container');
  if (!container) return;

  if (todoistLoading) {
    container.innerHTML = '<div class="todoist-loading">Loading Todoist tasks…</div>';
    return;
  }

  if (todoistError) {
    let msg = '';
    if (todoistError === 'not_configured') {
      msg = 'Todoist API token not configured. Add TODOIST_API_TOKEN to your environment variables.';
    } else {
      msg = 'Could not load Todoist tasks right now.';
    }
    container.innerHTML = `<div class="todoist-error">${msg}</div>`;
    return;
  }

  if (!todoistTasks || todoistTasks.length === 0) {
    container.innerHTML = '<div class="todoist-empty">All caught up — no tasks due today ✓</div>';
    return;
  }

  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Denver' });

  // Apply custom order if saved, otherwise pin + priority sort
  // "WORK STARTUP" is always pinned to the very top regardless of sort/drag order
  const customOrder = getTodoistOrder();
  const alwaysTopNames = getDomainConfig().alwaysTopNames;
  const pinnedNames = getDomainConfig().pinnedNames;
  // Always sort by priority first; within same priority, respect custom drag order
  let sortedTasks;
  const orderMap = {};
  if (customOrder.length > 0) {
    customOrder.forEach((id, i) => orderMap[id] = i);
  }
  sortedTasks = [...todoistTasks].sort((a, b) => {
    const aName = (a.content || '').toLowerCase();
    const bName = (b.content || '').toLowerCase();
    const aPinned = pinnedNames.some(n => aName.includes(n));
    const bPinned = pinnedNames.some(n => bName.includes(n));
    if (aPinned !== bPinned) return aPinned ? -1 : 1;
    // Primary: priority (higher number = higher priority in Todoist API)
    const pDiff = (b.priority || 1) - (a.priority || 1);
    if (pDiff !== 0) return pDiff;
    // Secondary: custom drag order within same priority
    if (customOrder.length > 0) {
      const aIdx = a.id in orderMap ? orderMap[a.id] : 9999;
      const bIdx = b.id in orderMap ? orderMap[b.id] : 9999;
      return aIdx - bIdx;
    }
    return 0;
  });
  // Always force "WORK STARTUP" to the top, even after drag reorder
  const topTasks = sortedTasks.filter(t => alwaysTopNames.some(n => (t.content || '').toLowerCase().includes(n)));
  const restTasks = sortedTasks.filter(t => !alwaysTopNames.some(n => (t.content || '').toLowerCase().includes(n)));
  sortedTasks = [...topTasks, ...restTasks];

  // Priority columns view
  if (todoistColumnsView) {
    renderTodoistColumns(container, sortedTasks);
    return;
  }

  container.innerHTML = sortedTasks.map(t => {
    // Todoist REST API: due.date, priority is 1-4 (4=most urgent)
    const dueDate = t.due ? (t.due.date || '').slice(0, 10) : null;
    const isOverdue = dueDate && dueDate < today;
    // Map REST API priority (4=urgent) to display
    const p = t.priority || 1;
    const priorityClass = p === 4 ? 'p1' : p === 3 ? 'p2' : p === 2 ? 'p3' : '';
    const priorityLabel = p === 4 ? 'P1' : p === 3 ? 'P2' : p === 2 ? 'P3' : '';
    const labels = (t.labels || []).join(', ');

    return `
      <div class="todoist-task ${priorityClass ? 'priority-' + priorityClass : ''}" data-task-id="${t.id}" data-title="${escAttr(todoistPlainText(t.content))}">
        <button class="todoist-check" onclick="completeTodoistTask('${t.id}')" aria-label="Complete task">✓</button>
        <div class="todoist-task-body">
          <div class="todoist-task-title">${todoistText(t.content)}</div>
          ${t.description ? `<div class="todoist-task-desc">${todoistText(t.description)}</div>` : ''}
          <div class="todoist-task-meta">
            ${isOverdue ? `<span class="todoist-task-overdue">Overdue · ${dueDate}</span>` : ''}
            ${priorityLabel ? `<span class="todoist-task-priority ${priorityClass}">${priorityLabel}</span>` : ''}
            ${labels ? `<span class="todoist-task-label">${esc(labels)}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Make Todoist tasks draggable
  new Sortable(container, {
    animation: 200,
    ghostClass: 'sortable-ghost',
    chosenClass: 'sortable-chosen',
    handle: '.todoist-task-body',
    draggable: '.todoist-task',
    setData: function(dataTransfer, dragEl) {
      const title = dragEl.dataset.title || dragEl.querySelector('.todoist-task-title')?.textContent || '';
      dataTransfer.setData('text/plain', JSON.stringify({
        type: 'todoist', id: dragEl.dataset.taskId, title: title, color: getTodoistPriorityColor(dragEl)
      }));
      dataTransfer.setData('application/todoist-task', '');
    },
    onEnd: function(evt) {
      const orderedIds = Array.from(container.querySelectorAll('.todoist-task')).map(el => el.dataset.taskId);
      saveTodoistOrder(orderedIds);
    }
  });
}

// ── Todoist priority columns toggle ──
let todoistColumnsView = false;

function toggleTodoistColumns() {
  todoistColumnsView = !todoistColumnsView;
  const btn = document.getElementById('todoist-col-toggle');
  if (btn) btn.classList.toggle('active', todoistColumnsView);
  renderTodoistSection();

function renderTodoistColumns(container, tasks) {
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Denver' });
  // Todoist API: priority 4 = P1 (urgent), 3 = P2, 2 = P3, 1 = P4 (no priority)
  const buckets = { p1: [], p2: [], p3: [], p4: [] };
  tasks.forEach(t => {
    const p = t.priority || 1;
    if (p === 4) buckets.p1.push(t);
    else if (p === 3) buckets.p2.push(t);
    else if (p === 2) buckets.p3.push(t);
    else buckets.p4.push(t);
  });

  const renderTask = (t) => {
    const dueDate = t.due ? (t.due.date || '').slice(0, 10) : null;
    const isOverdue = dueDate && dueDate < today;
    const p = t.priority || 1;
    const priorityClass = p === 4 ? 'p1' : p === 3 ? 'p2' : p === 2 ? 'p3' : '';
    const labels = (t.labels || []).join(', ');
    return `
      <div class="todoist-task ${priorityClass ? 'priority-' + priorityClass : ''}" data-task-id="${t.id}" data-title="${escAttr(todoistPlainText(t.content))}">
        <button class="todoist-check" onclick="completeTodoistTask('${t.id}')" aria-label="Complete task">✓</button>
        <div class="todoist-task-body">
          <div class="todoist-task-title">${todoistText(t.content)}</div>
          <div class="todoist-task-meta">
            ${isOverdue ? `<span class="todoist-task-overdue">Overdue</span>` : ''}
            ${labels ? `<span class="todoist-task-label">${esc(labels)}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  };

  const colHtml = (label, cls, tasks) => `
    <div class="todoist-priority-col">
      <div class="todoist-priority-col-header ${cls}">${label} <span class="todoist-priority-col-count">(${tasks.length})</span></div>
      ${tasks.length > 0 ? tasks.map(renderTask).join('') : '<div style="font-size:11px;color:var(--text-muted);padding:8px;opacity:0.5">—</div>'}
    </div>
  `;

  container.innerHTML = `
    <div class="todoist-priority-cols">
      ${colHtml('P1', 'p1', buckets.p1)}
      ${colHtml('P2', 'p2', buckets.p2)}
      ${colHtml('P3', 'p3', buckets.p3)}
      ${colHtml('P4', 'p4', buckets.p4)}
    </div>
  `;
}

// ── Migrate old state ──
function migrateState() {
  let changed = false;
  state.cards.forEach(c => {
    if (c.column === 'later') { c.column = 'lt-nov'; changed = true; }
  });

  // ── Focus-area colors: move the old muted swatches to the new, more distinct ones ──
  (state.projects || []).forEach(p => {
    const i = LEGACY_COLORS.indexOf(p.color);
    if (i !== -1) { p.color = DEFAULT_COLORS[i]; changed = true; }
  });

  // ── Week rollover: migrate next-week cards to this-week when Monday advances ──
  const now = new Date();
  const dayOfWeek = now.getDay();
  const currentMon = new Date(now);
  currentMon.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));
  const currentMonISO = currentMon.toLocaleDateString('en-CA');

  const lastMon = state.lastMonday || null;
  if (lastMon && lastMon < currentMonISO) {
    // Week has rolled — move nw-* cards to tw-* equivalents
    const nwDays = getDomainConfig().nextWeekDays || [];
    const twDays = getDomainConfig().weekDays || [];
    const nwToTw = {};
    nwDays.forEach(nw => {
      const dayLabel = nw.label; // e.g. 'Tue'
      const tw = twDays.find(d => d.label === dayLabel);
      if (tw) nwToTw[nw.id] = tw.id;
    });

    state.cards.forEach(c => {
      if (nwToTw[c.column]) {
        c.column = nwToTw[c.column];
        changed = true;
      } else if (c.column === 'next-week') {
        c.column = 'this-week';
        changed = true;
      }
    });
  }

  // Always update the stored Monday
  if (state.lastMonday !== currentMonISO) {
    state.lastMonday = currentMonISO;
    changed = true;
  }

  // ── Month rollover: promote this-month → this-week, matching later-month → this-month ──
  const currentMonthKey = 'lt-' + MONTH_ABBRS[now.getMonth()].toLowerCase(); // e.g. 'lt-oct'
  const lastMonth = state.lastMonth || null;
  if (lastMonth && lastMonth !== currentMonthKey) {
    // Month changed — move "this-month" cards to "this-week"
    state.cards.forEach(c => {
      if (c.column === 'this-month') {
        c.column = 'this-week';
        changed = true;
      }
    });
    // Move cards from the now-current month's later bucket to "this-month"
    state.cards.forEach(c => {
      if (c.column === currentMonthKey) {
        c.column = 'this-month';
        changed = true;
      }
    });
  }
  // Always update the stored month
  if (state.lastMonth !== currentMonthKey) {
    state.lastMonth = currentMonthKey;
    changed = true;
  }

  if (changed) saveState();
}

// ── Archive ──
const ARCHIVE_KEY = 'work-dashboard-archive-v1';
let archiveState = { cards: [] };

async function loadArchive() {
  try {
    const resp = await fetch('/api/board?key=archive');
    if (resp.ok) {
      const json = await resp.json();
      if (json.data) { archiveState = json.data; try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archiveState)); } catch(e) {} return; }
    }
  } catch(e) {}
  try {
    const raw = localStorage.getItem(ARCHIVE_KEY);
    if (raw) { archiveState = JSON.parse(raw); return; }
  } catch(e) {}
  archiveState = { cards: [] };
}

function saveArchive() {
  try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archiveState)); } catch(e) {}
  fetch('/api/board?key=archive', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(archiveState),
  }).catch(() => {});
}

function archiveCard(cardId) {
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;
  const now = new Date();
  archiveState.cards.push({
    ...card,
    archivedAt: now.toISOString(),
    archivedFrom: card.column,
    domain: activeDomain,
  });
  state.cards = state.cards.filter(c => c.id !== cardId);
  saveState();
  saveArchive();
  renderAll();
}

function unarchiveCard(cardId) {
  const card = archiveState.cards.find(c => c.id === cardId);
  if (!card) return;
  const { archivedAt, archivedFrom, ...restored } = card;
  // Put it back in the column it came from
  restored.order = state.cards.filter(c => c.column === archivedFrom).length;
  state.cards.push(restored);
  archiveState.cards = archiveState.cards.filter(c => c.id !== cardId);
  saveState();
  saveArchive();
  if (currentView === 'archive') showArchive();
  else renderAll();
}

// Default to current quarter

function showArchive(filter) {
  cleanupTodoist();

  todayView.classList.remove('active');
  punchView.classList.remove('active');
  view.classList.add('active');
  setActiveTab('archive');

  // Hide the FABs while in archive view
  document.getElementById('fab-stack').hidden = true;

  const now = new Date();
  const year = now.getFullYear();

  // Determine which months to show
  let displayMonths; // array of [year, monthIndex] (0-based)
  if (archiveFilter === 'q1') displayMonths = [[year,0],[year,1],[year,2]];
  else if (archiveFilter === 'q2') displayMonths = [[year,3],[year,4],[year,5]];
  else if (archiveFilter === 'q3') displayMonths = [[year,6],[year,7],[year,8]];
  else if (archiveFilter === 'q4') displayMonths = [[year,9],[year,10],[year,11]];
  else {
    // "Year" — show all 12 months
    displayMonths = Array.from({length: 12}, (_, i) => [year, i]);
  }

  // Filter archive cards to the active domain(s)
  const domainFilter = combinedToday
    ? (c => c.domain === 'personal' || c.domain === 'home' || !c.domain)
    : (c => c.domain === activeDomain || !c.domain);
  const domainCards = archiveState.cards.filter(domainFilter);
  const domainLabel = combinedToday ? 'P+H' : getDomainConfig().label;

  // Build month data
  const monthData = displayMonths.map(([y, m]) => {
    const key = y + '-' + String(m + 1).padStart(2, '0');
    const label = new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long' });
    const cards = domainCards.filter(c => {
      const d = new Date(c.archivedAt);
      return d.getFullYear() === y && d.getMonth() === m;
    }).sort((a, b) => new Date(b.archivedAt) - new Date(a.archivedAt));
    return { key, label, cards };
  });

  // Count totals for year
  const yearTotal = domainCards.filter(c => new Date(c.archivedAt).getFullYear() === year).length;

  const filterBtn = (f, label) => {
    const active = archiveFilter === f ? ' active' : '';
    return `<button class="archive-filter-btn${active}" onclick="showArchive('${f}')">${label}</button>`;
  };

  let html = `
    <div class="archive-header">
      <h1 class="archive-title">${domainLabel} Archive</h1>
      <p class="archive-subtitle">Completed focus areas${yearTotal ? ` · ${yearTotal} this year` : ''}</p>
      <div class="archive-filter-bar">
        ${filterBtn('year', year)}
        ${filterBtn('q1', 'Q1')}
        ${filterBtn('q2', 'Q2')}
        ${filterBtn('q3', 'Q3')}
        ${filterBtn('q4', 'Q4')}
      </div>
    </div>
    <div class="archive-months${archiveFilter !== 'year' ? ' quarterly' : ''}">
  `;

  monthData.forEach(({ label, cards }) => {
    html += `
      <div class="archive-month-col">
        <div class="archive-month-header" style="display:flex;align-items:center;justify-content:space-between">
          <span class="column-title">${esc(label)}</span>
          ${cards.length ? `<span class="column-count">${cards.length}</span>` : ''}
        </div>
        <div class="archive-card-list">
    `;
    if (cards.length === 0) {
      html += `<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:30px 10px">No archived items</div>`;
    } else {
      cards.forEach(c => {
        const color = getProjectColor(c.projectId);
        const d = new Date(c.archivedAt);
        const dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        html += `
          <div class="archive-card" onclick="openArchiveCardMenu('${c.id}', this)">
            <div class="archive-card-bar" style="background:${color}"></div>
            <div class="archive-card-content">
              <div class="archive-card-title">${esc(c.title)}</div>
              <div class="archive-card-date">${dateStr}</div>
            </div>
          </div>
        `;
      });
    }
    html += `</div></div>`;
  });

  html += `</div>`;
  view.innerHTML = html;
}

function openArchiveCardMenu(cardId, el) {
  closeCardMenu();
  const card = archiveState.cards.find(c => c.id === cardId);
  if (!card) return;

  const rect = el.getBoundingClientRect();
  const overlay = document.createElement('div');
  overlay.className = 'card-menu-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeCardMenu(); };

  const menu = document.createElement('div');
  menu.className = 'card-menu';
  menu.style.visibility = 'hidden';
  overlay.appendChild(menu);
  document.body.appendChild(overlay);

  const menuW = menu.offsetWidth || 220;
  let top = rect.bottom + 4;
  let left = rect.right - menuW;
  if (left < 8) left = 8;
  if (left + menuW > window.innerWidth - 8) left = window.innerWidth - menuW - 8;
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
  menu.style.visibility = '';

  const d = new Date(card.archivedAt);
  const dateStr = d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

  menu.innerHTML = `
    <div class="card-menu-section">Title</div>
    <div class="card-menu-note">
      <input type="text" value="${esc(card.title)}" placeholder="Card title…" id="archive-menu-title" />
    </div>
    <div class="card-menu-section">Note</div>
    <div class="card-menu-note">
      <input type="text" value="${esc(card.note || '')}" placeholder="Add a note…" id="archive-menu-note" />
    </div>
    <div class="card-menu-section" style="color:var(--text-muted);font-size:11px;padding:4px 12px">Archived ${dateStr}</div>
    <div class="card-menu-divider"></div>
    <div class="card-menu-item" data-action="unarchive">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      Unarchive
    </div>
    <div class="card-menu-item danger" data-action="delete">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      Delete permanently
    </div>
  `;

  const titleInput = menu.querySelector('#archive-menu-title');
  const saveTitle = () => {
    const text = titleInput.value.trim();
    if (text && text !== card.title) { card.title = text; saveArchive(); showArchive(); }
  };
  titleInput.addEventListener('blur', saveTitle);
  titleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); titleInput.blur(); } });

  const noteInput = menu.querySelector('#archive-menu-note');
  const saveNote = () => {
    card.note = noteInput.value.trim();
    saveArchive();
  };
  noteInput.addEventListener('blur', saveNote);
  noteInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); noteInput.blur(); } });

  menu.querySelectorAll('.card-menu-item').forEach(item => {
    item.addEventListener('click', () => {
      const action = item.dataset.action;
      if (action === 'unarchive') {
        closeCardMenu();
        unarchiveCard(cardId);
      } else if (action === 'delete') {
        closeCardMenu();
        if (confirm(`Permanently delete "${card.title}"?`)) {
          archiveState.cards = archiveState.cards.filter(c => c.id !== cardId);
          saveArchive();
          showArchive();
        }
      }
    });
  });
}

// Drag-to-archive: listen for SortableJS drag events on the FAB
function setupArchiveDragTarget() {
  const fab = document.getElementById('archive-fab');
  // Listen for dragover/drop on the FAB via pointer events
  // SortableJS uses HTML5 drag events
  fab.addEventListener('dragover', (e) => {
    e.preventDefault();
    fab.classList.add('drag-over');
  });
  fab.addEventListener('dragleave', () => {
    fab.classList.remove('drag-over');
  });
  fab.addEventListener('drop', (e) => {
    e.preventDefault();
    fab.classList.remove('drag-over');
    const raw = e.dataTransfer.getData('text/plain');
    if (!raw) return;
    let cardId = raw;
    try {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.id) cardId = parsed.id;
    } catch(err) { /* plain card ID from SortableJS */ }
    if (cardId) archiveCard(cardId);
  });
}

// ── Location-based domain selection ──
const WORK_COORDS = { lat: 39.6095, lon: -104.9378 }; // 6335 S Holly St, Centennial CO
const WORK_RADIUS_M = 200;

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function applyLocationDomain() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(false);
    navigator.geolocation.getCurrentPosition(
      pos => {
        const dist = haversineMeters(pos.coords.latitude, pos.coords.longitude, WORK_COORDS.lat, WORK_COORDS.lon);
        if (dist <= WORK_RADIUS_M) {
          // At work — switch to work domain
          if (activeDomain !== 'work') {
            activeDomain = 'work';
            try { localStorage.setItem('dashboard-active-domain', 'work'); } catch(e) {}
            THIS_WEEK_DAYS = getDomainConfig().weekDays;
            LATER_MONTHS = getDomainConfig().laterMonths;
            COLUMNS = getDomainConfig().columns;
          }
          resolve('work');
        } else {
          // Not at work — show P+H combined today
          resolve('combined');
        }
      },
      () => resolve(false), // denied or error — fall back to last-used
      { timeout: 3000, maximumAge: 300000 } // 3s timeout, cache up to 5 min
    );
  });
}

// ── Init ──
(async () => {
  const locationResult = await applyLocationDomain();
  applyDomainTheme();
  await loadState();
  await loadPunch();
  await loadArchive();
  migrateState();
  renderBoard();
  setupArchiveDragTarget();

  if (locationResult === 'combined') {
    showCombinedToday();
  } else if (locationResult === 'work') {
    const savedView = (() => { try { return localStorage.getItem('dashboard-view-work'); } catch(e) { return null; } })();
    const startView = ['horizons','week','today','punch','archive'].includes(savedView) ? savedView : 'today';
    if (startView === 'week') showWeek();
    else if (startView === 'today') showToday();
    else if (startView === 'punch') showPunch();
    else if (startView === 'archive') showArchive();
    else { showHorizons(); }
  } else {
    // Geolocation unavailable/denied — use last-saved view
    const savedView = (() => { try { return localStorage.getItem('dashboard-view-' + activeDomain); } catch(e) { return null; } })();
    const startView = ['horizons','week','today','punch','archive'].includes(savedView) ? savedView : 'horizons';
    if (startView === 'week') showWeek();
    else if (startView === 'today') showToday();
    else if (startView === 'punch') showPunch();
    else if (startView === 'archive') showArchive();
    else { showHorizons(); }
  }
})();
</script>
